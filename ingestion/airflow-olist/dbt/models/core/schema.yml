version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_unique_id
        tests: [not_null, unique]

  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]

  - name: dim_dates
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: fact_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: fact_order_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: total_item_value
        tests: [not_null]

  - name: fact_order_payments
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_value
        tests: [not_null]

  - name: fact_order_reviews
    columns:
      - name: review_id
        tests: [not_null, unique]